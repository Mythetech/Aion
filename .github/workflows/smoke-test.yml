# Build and launch Aion on each platform without signing or publishing
#
# Uses shared workflows from mythetech/workflows

name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to smoke test'
        type: choice
        options: [all, windows, macos, linux]
        default: all

permissions:
  contents: read

jobs:
  smoke-test:
    uses: mythetech/workflows/.github/workflows/desktop-smoke-test.yml@main
    with:
      app_name: "Aion"
      project_path: "Aion.Desktop/Aion.Desktop.csproj"
      test_project: "Aion.Test/Aion.Test.csproj"
      global_json_file: "global.json"
      icon_windows: "Aion.Desktop/wwwroot/aion.ico"
      icon_linux: "Aion.Desktop/wwwroot/aion512.png"
      icon_macos: "Aion.Desktop/wwwroot/aion.icns"
      platforms: ${{ inputs.platforms }}
